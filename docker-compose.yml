version: '3.8'

services:
  pingpay-nginx:
    image: nginx:alpine
    container_name: pingpay-nginx
    ports:
      - "3500:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - pingpay-backend
      - pingpay-frontend
    restart: unless-stopped
    networks:
      - pingpay-net

  pingpay-backend:
    image: ghcr.io/hawaiizfynest/pingpay-backend:latest
    container_name: pingpay-backend
    volumes:
      - pingpay-data:/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/data/pingpay.db
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - PUBLIC_URL=${PUBLIC_URL}
      - CORS_ORIGIN=${CORS_ORIGIN}
    restart: unless-stopped
    networks:
      - pingpay-net

  pingpay-frontend:
    image: ghcr.io/hawaiizfynest/pingpay-frontend:latest
    container_name: pingpay-frontend
    restart: unless-stopped
    networks:
      - pingpay-net

volumes:
  pingpay-data:

networks:
  pingpay-net:
    driver: bridge
