events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Increase body size for future file uploads
    client_max_body_size 10M;

    upstream backend {
        server pingpay-backend:3001;
    }

    upstream frontend {
        server pingpay-frontend:3002;
    }

    server {
        listen 80;
        server_name pingpay.cc www.pingpay.cc;

        # === API — route to backend ===
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Important for Twilio webhook signature validation
            proxy_set_header X-Twilio-Signature $http_x_twilio_signature;

            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        # === Health check passthrough ===
        location /health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # === Frontend — everything else ===
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            # SPA fallback — serve index.html for all routes
            proxy_intercept_errors on;
            error_page 404 = @fallback;
        }

        location @fallback {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }
    }
}
