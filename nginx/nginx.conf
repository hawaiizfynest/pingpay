events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    client_max_body_size 10M;

    upstream backend {
        server pingpay-backend:3001;
    }

    upstream frontend {
        server pingpay-frontend:3501;
    }

    server {
        listen 80;
        server_name _;

        # === Static legal pages served directly by nginx ===
        location = /privacy {
            root /static;
            try_files /privacy.html =404;
            add_header Content-Type text/html;
        }

        location = /terms {
            root /static;
            try_files /terms.html =404;
            add_header Content-Type text/html;
        }

        # === API — route to backend ===
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Twilio-Signature $http_x_twilio_signature;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        # === Health check ===
        location /health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # === Frontend — everything else ===
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
